<app-home-gallary></app-home-gallary>
<div class="flex flex-col items-center justify-center text-center p-4">
<div>
    <p class="font-bold text-4xl text-gray-900 dark:text-white">Tools</p>
    <p class="text-gray-900 dark:text-white">Lorem ipsum dolor sit amet consectetur adipisicing.</p>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-4 my-15">
@for (card of cards; track card.title) {
<div class="max-w-sm p-6 bg-white border border-black rounded-lg dark:bg-gray-800 dark:border-gray-700 relative">
    <i [class]="card.icon" class="size-10 bg-red-200 rounded-full absolute start-1/2 top-0 -translate-x-1/2 -translate-y-1/2 p-4"></i>
    <a href="#">
        <h5 class="mb-2 text-2xl font-semibold tracking-tight text-gray-900 dark:text-white">{{card.title}}</h5>
    </a>
    <div class="h-px w-10 bg-black my-2 mx-auto"></div>
    <p class="mb-3 font-normal text-gray-500 dark:text-gray-400">{{card.paragraph}}</p>
</div>
}
</div>
</div>
